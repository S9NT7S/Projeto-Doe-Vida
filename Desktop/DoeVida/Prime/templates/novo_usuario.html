<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="imagens/x-icon" href="{{ url_for('static', filename='imagens/blood1.png') }}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"> </script>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/novo_usuario.css') }}">
        <title>Cadastrar</title>
    </head>

    <body>

        <div class="divH1">
            <h1>Cadastrar novo usuário</h1>
        </div>

        {% if erro %}
        <p style="color:red; text-align:center;">{{ erro }}</p>
        {% endif %}

        <form class="usuario-form" method="post" action="{{ url_for('novo_usuario') }}">
                
                <div class="divSpanInput">
                    <div class="divSpan">
                        <label class="spanName" for="nome">Nome:</label>
                    </div>
                    
                    <div class="divInput">
                        <input type="text" class="inputName" id="nome" name="nome" required>
                    </div>
                </div>
                
                <div class="divLabel">
                    <label class="labelEmail" for="email">Email:</label>
                </div>
                <div class="divInput">
                    <input class="inputEmail" type="email" id="email" name="email" required>
                </div>

                <div class="divLabel">
                    <label class="labelPassword" for="senha">Senha:</label>
                </div>
                <div class="divInput">
                    <input class="inputPassword" type="password" id="senha" name="senha" required>
                </div>

                <div class="divLabel">
                    <label class="labelProfile" for="perfil">Perfil:</label>
                </div>
                <div class="divInput">
                    <select class="selectProfile" id="perfil" name="perfil" required>
                        <option value="primeira">Doador de primeira vez</option>
                        <option value="regular">Doador regular</option>
                        <option value="esporadico">Doador esporádico</option>
                        <option value="voluntario">Doador voluntário</option>
                        <option value="direcionado">Doador direcionado</option>
                    </select>
                </div>

                <div class="divLabel">
                    <label class="labelSex" for="sexo">Sexo:</label>
                </div>
                <div class="divInput">
                    <select class="selectSex" id="sexo" name="sexo" required>
                        <option value="feminino">Feminino</option>
                        <option value="masculino">Masculino</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>

                <div class="divLabel">
                        <label class="labelBlood" for="sangue">Tipo sanguíneo:</label>
                </div>
                <div class="divInput">
                    
                    <select class="selectBlood" id="sangue" name="sangue" required>
                        <option value="a_positivo">A positivo</option>
                        <option value="a_negativo">A negativo</option>
                        <option value="b_positivo">B positivo</option>
                        <option value="b_negativo">B negativo</option>
                        <option value="ab_positivo">AB positivo</option>
                        <option value="ab_negativo">AB negativo</option>
                        <option value="o_positivo">O positivo</option>
                        <option value="o_negativo">O negativo</option>
                        <option value="nao_tenho_certeza">Não tenho certeza</option>
                    </select>
                </div>

                <div class="divLabel">
                    <label class="labelAge" for="idadeInput">Idade:</label>
                </div>
                <div class="divInput">
                    <input class="inputAge" type="number" min="16" max="69" maxlength="2" id="idadeInput" oninput="criarMascara('Idade')" name="idade"  required>
                </div>

                <div class="divButton">
                    <button type="submit" onclick="return confirm('Tem certeza?');" value="Cadastrar" class="buttonSubmit">Salvar</button>
                </div>
                
                <div class="divButton">
                    <a class="buttonCancel" href="{{ url_for('listar_usuarios') }}">Cancelar</a>
                </div>

        </form>

        <form class="gerar-form" action="{{ url_for('gerar_usuarios') }}" method="POST">
                <button class="btn btn-danger" type="submit" value="Gerar Usuários">Gerar Usuários</button>
                <label for="qtd" style="margin: 0;"></label>
                <input type="number" id="qtd" min="1" value="5" required class="label_add">
           </form>
    </body>

    <script>
        function criarMascara(mascaraInput){
            const maximoInput = document.getElementById(`${mascaraInput}Input`).maxLength;
            let valorInput = document.getElementById(`${mascaraInput}Input`).value;
            let valorSemPonto = document.getElementById(`${mascaraInput}Input`).value.replace(/([^0-9])+/g, "");
            const mascaras = {
                Idade: valorInput.replace(/[^\d]/g, "")
            };
            
            valorInput.length === maximoInput ? document.getElementById(`${mascaraInput}Input`).value = mascaras[mascaraInput] : document.getElementById(`${mascaraInput}Input`).value = valorSemPonto;
        };
    </script>
</html>
