{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}

<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
        <title>Dashboard</title>
    </head>
    <body>
        <div class="graficos-container">

            <div class="grafico-card">
                <div class="grafico-titulo">Usuários</div>
                <canvas id="graficoUsuarios"></canvas>
            </div>

            <div class="grafico-card">
                <div class="grafico-titulo">Usuários por grupo</div>
                <canvas id="graficoGrupos"></canvas>
            </div>

            <div class="grafico-card">
                <div class="grafico-titulo">Defeitos por módulo</div>
                <canvas id="graficoDefeitos"></canvas>
            </div>

            <div class="grafico-card">
                <div class="grafico-titulo">Evolução do sistema</div>
                <canvas id="graficoEvolucao"></canvas>
            </div>

            <div class="grafico-card">
                <div class="grafico-titulo">Ranking de uso</div>
                <canvas id="graficoRanking"></canvas>
            </div>

            <div class="grafico-card">
                <div class="grafico-titulo">Acessos ao sistema</div>
                <canvas id="graficoArea"></canvas>
            </div>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

        <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

    </body>
</html>

{% endblock %}
